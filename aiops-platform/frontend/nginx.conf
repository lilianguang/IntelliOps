server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
    # index.html 不缓存，确保浏览器每次获取最新版本（Vite 用 hash 命名 JS，但 index.html 引用会变）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }
    # 带 hash 的静态资源可以长期缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # SSE 流式端点 —— 必须关闭 proxy_buffering 实现实时推送
    location ~ ^/api/ai/(chat/stream|netinsight/chat)$ {
        proxy_pass http://aiops-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
    }
    location /api/ {
        proxy_pass http://aiops-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI对话涉及ES检索+大模型分析，需要较长超时
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
